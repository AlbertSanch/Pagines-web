# Descarga las fuentes oficiales de los festivos (BOE y boletines autonómicos)
# y guarda su texto en festivos/fuentes/, en la misma rama que lo lanza.
name: Festivos - fuentes

on:
  push:
    paths:
      - festivos/fuentes.json
      - festivos/scripts/descargar_fuentes.py
      - .github/workflows/festivos-fuentes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: festivos-fuentes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Descargar
        run: python festivos/scripts/descargar_fuentes.py
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add festivos/fuentes
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Festivos: actualizar fuentes oficiales"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
