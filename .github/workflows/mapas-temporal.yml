# Temporal: descarga los contornos del INE en la rama de trabajo para preparar los mapas.
name: Mapas del INE (temporal)

on:
  workflow_dispatch:
  push:
    branches: [claude/trusting-bell-woc5fv]
    paths:
      - rentamedia/scripts/descargar_mapas.py
      - .github/workflows/mapas-temporal.yml

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python rentamedia/scripts/descargar_mapas.py
      - name: Guardar los datos en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add rentamedia/data/geo_*.json
          git commit -m "Contornos del INE descargados" || echo "Sin cambios"
          git push
