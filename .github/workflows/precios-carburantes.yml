# Actualiza ahorrometro/datos/carburantes.json y las páginas por provincia
# (ahorrometro/gasolina/) con los precios del Ministerio, y ahorrometro/datos/luz.json
# con el precio medio de la luz de Red Eléctrica.
# Cada commit en main lo publica Cloudflare Pages automáticamente.
name: Precios de carburantes

on:
  schedule:
    - cron: "17 6 * * *"   # ~08:17 hora peninsular (verano), 07:17 (invierno)
    - cron: "17 15 * * *"  # ~17:17 / 16:17
  workflow_dispatch:        # botón «Run workflow» en la pestaña Actions
  push:
    branches: [main]
    paths:
      - scripts/actualizar_carburantes.py
      - scripts/paginas_provincia.py
      - scripts/actualizar_luz.py
      - .github/workflows/precios-carburantes.yml

permissions:
  contents: write

concurrency:
  group: precios-carburantes
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y resumir precios
        env:
          # Worker de Cloudflare (cloudflare/proxy-carburantes.js): el Ministerio corta
          # las conexiones que llegan directamente desde GitHub Actions.
          CARBURANTES_PROXY: https://proxy-carburantes.albertsanchezguiu.workers.dev
        run: python scripts/actualizar_carburantes.py

      - name: Precio medio de la luz (Red Eléctrica)
        continue-on-error: true
        run: python scripts/actualizar_luz.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ahorrometro/datos/carburantes.json ahorrometro/datos/luz.json ahorrometro/gasolina ahorrometro/precio-gasolina-hoy.html ahorrometro/sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios."
            exit 0
          fi
          git commit -m "Actualizar precios de carburantes y luz"
          git pull --rebase origin main
          git push origin HEAD:main
